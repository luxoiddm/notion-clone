# Конфиг coturn — свой STUN/TURN-сервер для видеозвонков (WebRTC),
# без сторонних сервисов. Устанавливается и работает как отдельный
# системный сервис, не как часть Node-приложения.
#
# Установка на Ubuntu/Debian:
#   sudo apt install coturn
#   sudo cp deploy/turnserver.conf /etc/turnserver.conf
#   sudo nano /etc/turnserver.conf   # заполнить realm/secret/сертификаты ниже
#   sudo nano /etc/default/coturn    # раскомментировать TURNSERVER_ENABLED=1
#   sudo systemctl enable --now coturn
#
# static-auth-secret ниже должен буквально совпадать с TURN_SECRET в
# apps/server/.env — сервер генерирует короткоживущие креды этим
# секретом (см. packages/core-webrtc/src/turnCredentials.ts), coturn
# проверяет их тем же секретом. Сгенерировать случайный:
#   openssl rand -hex 32
#
# ПРОВЕРЬ ПЕРЕД ЗАПУСКОМ: если на сервере уже стоит другой
# WebRTC-сервис со своим встроенным TURN (например, Galene — у него
# по умолчанию тоже 1194 или явно настраиваемый порт, но нередко его
# перенастраивают именно на «стандартный» 3478) — порт будет занят, и
# coturn не поднимется вообще (`journalctl -xeu coturn`, ошибки вида
# "Address already in use"). Проверить заранее:
#   sudo ss -tulpn | grep 3478
# Если порт занят чужим процессом, а трогать его не хочется — смени
# listening-port/tls-listening-port ниже на свободные (например, 3479 и
# 5350), пропиши те же значения в TURN_PORT/TURN_TLS_PORT в
# apps/server/.env, и открой именно их в файрволе — coturn не обязан
# сидеть строго на 3478, это просто общепринятый дефолт. Заодно сверь
# min-port/max-port ниже с диапазоном релея у другого сервиса — то же
# самое может незаметно конфликтовать уже на этапе передачи медиа, а не
# при старте сервиса.

listening-port=3478
tls-listening-port=5349

# Если сервер сидит за NAT/floating IP облачного провайдера (частая
# ситуация — у самой машины на интерфейсе приватный адрес вроде
# 192.168.x.x, а снаружи виден другой, публичный) — обязательно
# раскомментируй и заполни строку ниже. Без неё звонки будут отлично
# работать между людьми в одной сети (или через простой NAT, где хватает
# STUN), но не через интернет между разными сетями: coturn будет слышать
# запросы правильно, а вот при выдаче адреса для релея media-потока будет
# сообщать собеседнику свой приватный адрес — недостижимый снаружи.
# Формат: external-ip=<публичный-IP>/<приватный-IP-этой-машины>.
# Определить публичный IP: curl ifconfig.me
# Определить приватный IP интерфейса: ip -4 addr show | grep inet
#external-ip=203.0.113.10/192.168.0.23

# Диапазон портов для реально ретранслируемого медиапотока (когда прямое
# P2P-соединение не удалось и трафик идёт через этот сервер). Открой этот
# же диапазон в файрволе — самая частая причина «TURN настроен, но
# всё равно не работает» это именно забытый файрвол на UDP-диапазоне,
# а не сам coturn.
min-port=49152
max-port=49452

fingerprint
use-auth-secret
static-auth-secret=CHANGE_ME_SAME_AS_TURN_SECRET_IN_ENV

# Домен/имя сервера — не обязательно совпадает с TURN_HOST из .env
# (тот может быть просто IP), но должно быть осмысленным значением,
# не пустым.
realm=workspace.example.com

# Не пересылать трафик на приватные/локальные адреса и обратно на сам
# сервер — стандартная защита coturn от использования как открытого
# прокси во внутреннюю сеть.
no-loopback-peers
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

total-quota=100
stale-nonce=600
no-cli
no-tlsv1
no-tlsv1_1

# TLS-сертификаты для turns:// (TURN поверх TLS) — тот же сертификат,
# что и у nginx (deploy/nginx.conf), если используется Let's Encrypt.
# Не обязательно для базовой работы (обычный turn:// без TLS работает
# и без этих строк), но снижает риск, что корпоративный файрвол
# заблокирует нешифрованный TURN-трафик по глубокой инспекции пакетов.
# cert=/etc/letsencrypt/live/workspace.example.com/fullchain.pem
# pkey=/etc/letsencrypt/live/workspace.example.com/privkey.pem

log-file=/var/log/turnserver.log
simple-log
