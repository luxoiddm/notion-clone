# Workspace — пример файла ответов для установки без вопросов:
#   sudo bash deploy/install/install.sh --answers answers.conf --non-interactive
# Windows:
#   install-windows.cmd -AnswersFile answers.conf -NonInteractive
#
# После установки такой же файл (без паролей) лежит в /opt/workspace/install.conf
# (C:\Workspace\install.conf) — его удобно взять за основу для следующего сервера.

# domain — по домену с Let's Encrypt; ip — по IP с самоподписанным сертификатом
MODE=domain
DOMAIN=workspace.company.ru
LE_EMAIL=admin@company.ru
# Внешний IPv4 сервера (A-запись домена должна указывать на него)
SERVER_IP=203.0.113.10

ADMIN_EMAIL=admin@company.ru
ADMIN_NAME=Администратор
# Пароль первого администратора. Не задан — будет сгенерирован и показан в конце.
# ADMIN_PASSWORD=

# Видеозвонки через свой TURN (coturn) — Linux и macOS: yes | no
CALLS=yes
TURN_PORT=3478
TURN_TLS_PORT=5349
TURN_MIN_PORT=49152
TURN_MAX_PORT=49452
# Windows: внешний TURN-сервер (CALLS=external)
# TURN_HOST=turn.company.ru
# TURN_SECRET=

# Файрвол. Linux: nft-new (новый сервер: только nftables, остальные отключить),
#   nft-add (своя таблица nftables рядом с существующими правилами),
#   existing (добавить порты в ufw/firewalld), none.
# macOS: macos | none. Windows: new | rules.
FIREWALL=nft-new
SSH_PORTS=22
# Дополнительные порты: 8443/tcp,51820/udp
EXTRA_PORTS=
