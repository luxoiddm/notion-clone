# Реверс-прокси для Workspace: один домен наружу, внутри — два процесса
# (Next.js веб-приложение и Express+Socket.io API).
#
# Порты ниже (3000 / 4000) соответствуют apps/web/.env.local и
# apps/server/.env из install.md — поменяй, если у тебя другие значения
# PORT в этих файлах.
#
# Видеозвонки (WebRTC): coturn (STUN/TURN) сюда НЕ входит и через nginx
# не проксируется — это отдельный системный сервис на своих портах
# (3478, 5349, диапазон релея медиа), открытых в файрволе напрямую, не
# через HTTP(S). См. install.md, «Шаг 8. STUN/TURN для видеозвонков» и
# deploy/turnserver.conf.
#
# Установка: скопируй в /etc/nginx/sites-available/workspace.conf,
# затем: ln -s /etc/nginx/sites-available/workspace.conf /etc/nginx/sites-enabled/
# и nginx -t && systemctl reload nginx

upstream workspace_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream workspace_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# HTTP -> HTTPS редирект. Если TLS не нужен (например, прокси уже стоит за
# внешним балансировщиком с HTTPS), удали этот блок и слушай 80 напрямую
# в блоке ниже вместо 443.
server {
    listen 80;
    listen [::]:80;
    server_name workspace.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name workspace.example.com;

    ssl_certificate     /etc/letsencrypt/live/workspace.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workspace.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Загрузка вложений в редакторе ограничена 25MB на файле (multer в
    # apps/server/src/routes/storage.routes.ts) — оставляем небольшой запас.
    client_max_body_size 30m;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # --- Проверка живости API (curl https://.../health) -------------------
    location = /health {
        proxy_pass http://workspace_api/health;
        proxy_set_header Host $host;
    }

    # --- REST API (Express) ---------------------------------------------
    location /api/ {
        proxy_pass http://workspace_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # --- Socket.io (presence, курсоры, сигналинг звонков) ----------------
    # Отдельный location обязателен: сюда нужны заголовки апгрейда до
    # WebSocket, которые для обычного /api/ не нужны и не должны стоять
    # по умолчанию на всех запросах.
    location /socket.io/ {
        proxy_pass http://workspace_api;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s; # держим сокет открытым долго, не рвём простаивающие соединения
    }

    # --- Next.js веб-приложение -------------------------------------------
    location / {
        proxy_pass http://workspace_web;
        proxy_http_version 1.1;

        # На случай Hot Module Reload / dev-режима через прокси — в проде
        # не мешает, но не обязателен.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
